name: Build OpenWrt x86_64 BIOS

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "OpenWrt branch or tag"
        required: true
        default: "openwrt-25.12"
        type: string
  push:
    paths:
      - "configs/**"
      - "files/**"
      - "scripts/**"
      - "local-packages/**"
      - ".github/workflows/build-openwrt.yml"

permissions:
  contents: read

concurrency:
  group: openwrt-x86_64-bios
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENWRT_REF: ${{ inputs.openwrt_ref || 'openwrt-25.12' }}
      JOBS: "2"
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget subversion xsltproc python3-dev libelf-dev \
            ca-certificates cpio libxml-parser-perl
          sudo apt-get clean

      - name: Build firmware
        run: bash scripts/build.sh

      - name: Upload firmware and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64-bios-${{ github.run_number }}
          path: |
            artifacts/**
            openwrt/bin/targets/x86/64/**
          if-no-files-found: warn
          retention-days: 14
